<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Indicador</title>
</head>
<body>
{% load i18n %}
{% comment %}
Incluir con: {% include "turnos/_pasos_indicador.html" with paso_actual=N %}
{% endcomment %}

<ol class="wizard-pasos" aria-label="{% trans 'Progreso de reserva' %}">
  <li class="wizard-paso {% if paso_actual == 1 %}wizard-paso--activo{% elif paso_actual > 1 %}wizard-paso--hecho{% endif %}">
    <span class="wizard-paso__num">1</span>
    <span class="wizard-paso__label">{% trans "Actividad" %}</span>
  </li>
  <li class="wizard-paso {% if paso_actual == 2 %}wizard-paso--activo{% elif paso_actual > 2 %}wizard-paso--hecho{% endif %}">
    <span class="wizard-paso__num">2</span>
    <span class="wizard-paso__label">{% trans "Fecha" %}</span>
  </li>
  <li class="wizard-paso {% if paso_actual == 3 %}wizard-paso--activo{% elif paso_actual > 3 %}wizard-paso--hecho{% endif %}">
    <span class="wizard-paso__num">3</span>
    <span class="wizard-paso__label">{% trans "Horario" %}</span>
  </li>
  <li class="wizard-paso {% if paso_actual == 4 %}wizard-paso--activo{% endif %}">
    <span class="wizard-paso__num">4</span>
    <span class="wizard-paso__label">{% trans "Confirmar" %}</span>
  </li>
</ol>
</body>
</html>
