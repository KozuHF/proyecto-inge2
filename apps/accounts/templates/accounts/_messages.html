{% if messages %}
<div class="mb-4 space-y-2">
    {% for message in messages %}
    <div class="p-4 text-sm rounded-lg
        {% if message.tags == 'error' %}text-red-800 bg-red-50 border border-red-200
        {% elif message.tags == 'warning' %}text-yellow-800 bg-yellow-50 border border-yellow-200
        {% elif message.tags == 'success' %}text-green-800 bg-green-50 border border-green-200
        {% else %}text-blue-800 bg-blue-50 border border-blue-200{% endif %}"
        role="alert">
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
