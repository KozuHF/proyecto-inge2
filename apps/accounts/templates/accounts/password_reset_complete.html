{% extends "_base.html" %}

{% block title %}Contraseña actualizada — Club360{% endblock title %}

{% block body %}
<div class="min-h-screen flex flex-col bg-gray-50">

    <header class="bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-screen-xl mx-auto p-4">
            <a href="{% url 'home' %}" class="flex items-center space-x-2">
                <svg class="w-8 h-8 text-green-600" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm0 18a8 8 0 110-16 8 8 0 010 16zm-1-11h2v6h-2zm0-4h2v2h-2z"/>
                </svg>
                <span class="text-2xl font-extrabold text-green-700 tracking-tight">Club<span class="text-gray-800">360</span></span>
            </a>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md text-center">
            <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-8">
                <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-green-100">
                    <svg class="h-6 w-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-extrabold text-gray-900 mb-3">Contraseña actualizada</h1>
                <p class="text-gray-500 text-sm mb-6">
                    Tu contraseña fue restablecida correctamente. Ya podés iniciar sesión con tu nueva contraseña.
                </p>
                <a href="{% url 'accounts:login' %}"
                    class="inline-block w-full text-white bg-green-600 hover:bg-green-700 focus:ring-4 focus:outline-none focus:ring-green-300 font-semibold rounded-lg text-sm px-5 py-3 transition">
                    Iniciar sesión
                </a>
            </div>
        </div>
    </main>
</div>
{% endblock body %}
