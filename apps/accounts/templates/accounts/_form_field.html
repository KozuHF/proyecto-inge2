<div class="{% if field.errors %}mb-1{% else %}mb-4{% endif %}">
    <label for="{{ field.id_for_label }}" class="block mb-2 text-sm font-medium text-gray-900">
        {{ field.label }}{% if field.field.required %}<span class="text-red-500">*</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text and not field.errors %}
    <p class="mt-1 text-xs text-gray-500">{{ field.help_text }}</p>
    {% endif %}
    {% if field.errors %}
    <p class="mt-1 text-sm text-red-600">{{ field.errors|join:", " }}</p>
    {% endif %}
</div>
