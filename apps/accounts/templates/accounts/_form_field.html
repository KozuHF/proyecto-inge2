<div class="{% if field.errors %}mb-1{% else %}mb-4{% endif %}">
    <label for="{{ field.id_for_label }}" class="block mb-2 text-sm font-medium text-gray-900{% if is_panel %} dark:text-gray-300{% endif %}">
        {{ field.label }}{% if field.field.required and not field.field.disabled %}<span class="text-red-500">*</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text and not field.errors %}
    <p class="mt-1 text-xs text-gray-500{% if is_panel %} dark:text-gray-400{% endif %}">{{ field.help_text }}</p>
    {% endif %}
    {% if field.errors %}
    <p class="mt-1 text-sm text-red-600{% if is_panel %} dark:text-red-400{% endif %}">{{ field.errors|join:", " }}</p>
    {% endif %}
</div>
