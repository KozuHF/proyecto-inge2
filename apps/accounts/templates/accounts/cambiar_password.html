{% extends "_base.html" %}

{% block title %}Cambiar contraseña - Club360{% endblock title %}

{% block content %}

<h1>Cambiar contraseña</h1>
 
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Actualizar contraseña</button>
    <a href="{% url 'accounts:detalle' user.pk %}">Cancelar</a>
</form>

{% endblock content %}
